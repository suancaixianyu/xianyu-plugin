<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      .box {
        display: flex;
        flex-wrap: wrap;
      }
      .col {
        display: flex;
        flex-wrap: wrap;
      }
      .item {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background-size: cover;
        border: none;
      }
      .item-0 {
        background-image: url('{{_res}}img/led.png');
      }
      .item-1 {
        background-image: url('{{_res}}img/qiang.png');
      }
      .item-3 {
        background-image: url('{{_res}}img/box.png');
      }
      .item-2 {
        background-image: url('{{_res}}img/target.png');
      }
      .item-5 {
        background-image: url('{{_res}}img/target_on.png');
      }
      .item-4 {
        background-image: url('{{_res}}img/play.png');
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="box">
        {{each map el}}
        <div class="col">
          {{each el item}}
          <div class="item item-{{item}}" style="width: {{780 / el.length}}px;height: {{800 / el.length}}px;"></div>
          {{/each}}
        </div>
        {{/each}}
      </div>
    </div>
    <p style="text-align: center">Created by Yunzai-Bot & xianyu-plugin</p>
  </body>
</html>

<!DOCTYPE html>
<html>

<head>
  <title>咸鱼插件</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta name="description" content="This is my website.">
  <meta name="keywords" content="website, products, services">

  <style>

    @font-face {
      font-family: 'xianyu';
      src: url('{{鸡鸡地址}}fonts/咸鱼手写体.ttf')
    }

    body {
      background: url('{{鸡鸡地址}}html/img/background.png') no-repeat center center fixed;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      margin: 0;
      padding: 0;
      font-family: 'xianyu', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
      text-align: center;
    }

    .neiron{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
      text-align: center;
    }
    .box{
      border: 2px solid rgba(255,239,191, 0.5);
      border-radius: 10px;
      background-color: rgba(255,239,191, 0.1);
      backdrop-filter: blur(5px);
      padding: 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 5px 5px 3px #FAE2B4, -5px -5px 3px #FAE2B4, 5px -5px 3px #FAE2B4, -5px 5px 3px #FAE2B4;
    }

    a {
      background-color: white;
      color: black;
      padding: 1rem 2rem;
      border: none;
      border-radius: 5px;
      font-size: 1.2rem;
      margin: 1rem;
      cursor: pointer;
      text-decoration: none;
    }

    a:active {
      background-color: white;
      color: white;
    }

    p{
      font-size: 1.5em;
    }

    th{
      text-align: center;
      background-color: #fddbb3;
    }
    th, td, th, #help{
      border: 2px solid #B58863;
      border-left-color: #fff;
      border-top-color: #fff;
      text-align: left;
      padding: 8px;
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="neiron">
      <div class="content">
        <h1>Yunzai-Bot 咸鱼插件</h1>
        <p>Yunzai-Bot & xianyu-plugin</p>
      </div>
      <div class="box content">
        <div class="content">
          <h3>扫雷游戏</h3>
          <p>发送 扫雷帮助 查看详情</p>
        </div>
        <div class="content">
          <h3>国际象棋游戏</h3>
          <p>发送 国际象棋帮助 查看详情</p>
        </div>
        <div class="content">
          <h3>中国象棋游戏</h3>
          <p>暂时参考国际象棋移动方法，将 '移动' 改为 '移子' 即可</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

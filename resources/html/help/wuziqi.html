<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        background-color: bisque;
      }

      #app {
        display: flex;
      }

      #box {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
      }

      .b {
        background-image: url('{{_res}}img/b_box.png');
      }

      .r {
        background-image: url('{{_res}}img/r_box.png');
      }

      .latticebox {
        width: 100%;
        height: 100%;
        background-size: cover;
      }

      #box .lattice {
        width: 73px;
        height: 75px;
        margin: 0rem 0.15rem;
        background-size: cover;
      }

      th {
        text-align: center;
        background-color: #fddbb3;
      }

      th,
      td,
      th,
      #help {
        border: 2px solid #b58863;
        border-left-color: #fff;
        border-top-color: #fff;
        text-align: left;
        padding: 8px;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="box1" style="text-align: center">
        <div class="box content" id="help">
          <table>
            <tbody>
              <tr>
                <th>指令</th>
                <th>说明</th>
                <th>注意</th>
                <th>示例指令</th>
              </tr>
              <tr>
                <td>#五子棋<br /></td>
                <td>开始游戏，人机局</td>
                <td></td>
                <td>#五子棋</td>
              </tr>
              <tr>
                <td>（发起|加入）五子棋</td>
                <td>玩家对战</td>
                <td></td>
                <td>发起五子棋</td>
              </tr>
              <tr>
                <td>#结束五子棋</td>
                <td>结束游戏</td>
                <td></td>
                <td>#结束五子棋</td>
              </tr>
              <tr>
                <td>下棋</td>
                <td>下棋指令没有前缀，直接使用两个数字：行，列</td>
                <td>两数字中间的符号随意，也可以是空格，但中间只能有一个符号</td>
                <td>9，9</td>
              </tr>
            </tbody>
            <colgroup>
              <col style="width: 25%" />
              <col style="width: 25%" />
              <col style="width: 25%" />
              <col style="width: 25%" />
            </colgroup>
          </table>
        </div>
      </div>
    </div>
    <p>Created by Yunzai-Bot & xianyu-plugin</p>
  </body>
</html>

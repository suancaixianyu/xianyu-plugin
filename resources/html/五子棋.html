<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: white;
        }
        .app{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .item{
            width: 42px;
            height: 42px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
        .X{
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            border: 1px solid black;
        }
        .O{
            width: 40px;
            height: 40px;
            background-color: black;
            border-radius: 50%;
            border: 1px solid white;
        }
        .box{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            width:756px;
            background-image: url('{{_res}}/html/img/五子棋背景.png');
            background-repeat: no-repeat;
            background-size: 672px;
            background-position: 62px 20px;
        }

    </style>
</head>

<body>
    <div class="app">

        <div class="item">0</div>
        {{each _data el index}}
        <div class="item">{{index+1}}</div>
        {{/each}}
        <div class="box">

            {{each _data el index}}
            <div class="item">{{index+1}}</div>
            {{ each el x}}
            <div class="item"><div class="{{x}}"></div></div>
            {{/each}}
            {{/each}}
        </div>
        
        
        
    </div>
    <p style="text-align: center;">Created by Yunzai-Bot & xianyu-plugin</p>

</body>
<script type="text/javascript">

</script>

</html>

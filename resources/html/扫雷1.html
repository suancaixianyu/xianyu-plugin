<!DOCTYPE html>

    <style>
      body {
        background-color: #bdbdbd;
      }

      .box {
        display: flex;
        flex-wrap: wrap;
      }

      .num {
        width: 45px;
        height: 80px;
        background-size: cover;
      }

      .item {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background-size: cover;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .message {
        font-size: 14px;
        display: flex;
        justify-content: space-between;
      }

      .content {
        border: none;
        box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
        padding: 4px;
        margin: 4px;
      }

      .landmines {
        display: flex;
        justify-content: center;
      }

      .head {
        border: 5px solid #808080;
        border-left-color: #fff;
        border-top-color: #fff;
      }

  <body>
    <div id="app">
      <div class="message content">
        <div class="landmines">
          {{each _mapData.z num}}
          <div class="num z-{{num}}"></div>
          {{/each}}
        </div>

        <div
          class="head"
          style="
            background-size: cover;
            width: 70px;
            height: 70px;
            background-image: url(data:img/gif;base64,R0lGODlhFQAVAJEAAAAAAP//AL29vQAAACH5BAAHAP8ALAAAAAAVABUAAAJAlI+py50AoUMwWCsduBy33XXAAoaiUlZY+nBq8MKUSY9HSbtzft4X/vu1MCLhcBXRoXgyBlD5AWYmgsiUis0yCgA7);
          "
        ></div>

        <div class="head" style="width: 70px; height: 70px"></div>

        <!-- <div class="item" style="${sty}background-image: url(${icon.landmine['-']})"></div> -->

        <!-- <div class="head" style="background-size:cover;width:70px;height:70px;background-image:url('{{headurl}}')"></div> -->
      </div>
      <div class="box content">
        {{each _mapData.map x i}}
        <div class="row">
          {{each x xx j}}
          <div class="item l-{{xx}}" style="width: {{_mapData.size}}px;height: {{_mapData.size}}px;">
            {{if xx == 'off' || xx == 'on'}}
            <span> {{_mapData.axis[i][j]}} </span>
            {{/if}}
          </div>
          {{/each}}
        </div>
        {{/each}}
      </div>
      <p>{{command}}</p>
    </div>
    <p>Created by Yunzai-Bot & xianyu-plugin</p>
  </body>
